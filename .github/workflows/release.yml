name: Release

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - CHANGELOG.md
      - skills/**
      - scripts/package_skill.py
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid VERSION: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset=dist/ohmytaste-v$VERSION.zip" >> "$GITHUB_OUTPUT"

      - name: Repository checks
        run: python scripts/check_repo.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Build release ZIP
        run: python scripts/package_skill.py --output "${{ steps.version.outputs.asset }}"

      - name: Create GitHub release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ASSET: ${{ steps.version.outputs.asset }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi

          args=(
            release create "$TAG" "$ASSET"
            --target "$GITHUB_SHA"
            --title "OhMyTaste $TAG"
            --generate-notes
          )

          if [[ "$VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi

          gh "${args[@]}"
